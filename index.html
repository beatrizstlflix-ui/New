<style>
:root{
  --bg:#0c0f13; --bg-elev:#12161c; --card:#161b22; --card-2:#1b212a;
  --border:#262d38; --text:#e7ebf1; --text-dim:#9aa7b8; --text-faint:#6b7688;
  --accent:#5b8cff;
  --assine:#6366f1; --lari:#14b8a6; --lote:#f0a63a; --downsell:#a855f7;
  --green:#22c55e; --red:#ef4444; --amber:#f0a63a;
  --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:14px;line-height:1.5;}
.wrap{max-width:1400px;margin:0 auto;padding:20px 24px 80px;}
a{color:inherit;}
h1,h2,h3,h4{margin:0;font-weight:600;}
.header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:24px;}
.header h1{font-size:22px;letter-spacing:-0.02em;}
.header .sub{color:var(--text-dim);font-size:13px;margin-top:4px;}
.updated{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
.updated b{color:var(--text);}
section{margin-bottom:36px;}
.section-title{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.section-title h2{font-size:16px;}
.section-title .tag{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.note{color:var(--text-faint);font-size:12px;margin-top:6px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-5{grid-template-columns:repeat(3,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;min-width:0;}
.card h3{font-size:12.5px;color:var(--text-dim);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.metric{font-size:26px;font-weight:700;letter-spacing:-0.02em;}
.metric.small{font-size:19px;}
.metric-sub{color:var(--text-dim);font-size:12.5px;margin-top:4px;}
.na{color:var(--text-faint);font-weight:500;font-style:italic;font-size:16px;}

.period-card{border-top:3px solid var(--accent);}
.period-card.yesterday{border-top-color:#5b8cff;}
.period-card.last4{border-top-color:#22c55e;}
.period-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.period-head h3{font-size:14px;color:var(--text);text-transform:none;letter-spacing:0;}
.stat-tiles{display:flex;gap:28px;flex-wrap:wrap;}
.stat-tile-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.stat-tile-value{font-size:36px;font-weight:800;letter-spacing:-0.02em;color:var(--text);}
.stat-tile-value.na{font-size:18px;font-weight:500;font-style:italic;color:var(--text-faint);}
.period-card.yesterday .stat-tile:last-child .stat-tile-value{color:#5b8cff;}
.period-card.last4 .stat-tile:last-child .stat-tile-value{color:var(--green);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--text-faint);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
th:hover{color:var(--text);}
th.sorted::after{content:" ▾";}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
tr.inactive-row td{color:var(--text-faint);}

.chart-box.tall{height:480px;}
.empty-state{color:var(--text-faint);font-size:13px;padding:40px 10px;text-align:center;border:1px dashed var(--border);border-radius:8px;}

select, .select{background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:12.5px;}

.confidence{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);}

footer{color:var(--text-faint);font-size:11.5px;text-align:center;padding-top:20px;border-top:1px solid var(--border);}

<script>
/* =========================================================
   2. UTILITÁRIOS
   ========================================================= */
const fmtBRL = v => (v===null||v===undefined||isNaN(v)) ? "Não informado" :
  v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const fmtNum = (v,d=0) => (v===null||v===undefined||isNaN(v)) ? "Não informado" :
  v.toLocaleString("pt-BR", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPct = (v,d=1) => (v===null||v===undefined||isNaN(v)) ? "Não informado" :
  (v*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const fmtDateBR = iso => { const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const isNum = v => typeof v === "number" && !isNaN(v);

function cpaValue(spend, conv){
  if(!isNum(spend) || !isNum(conv) || conv<=0) return null;
  return spend/conv;
}
function cpaLabel(spend, conv){
  if(!isNum(spend) || !isNum(conv)) return "Não informado";
  if(conv===0) return "Sem conversões";
  return fmtBRL(spend/conv);
}
function shareLabel(part, total){
  if(!isNum(part) || !isNum(total) || total<=0) return "Não informado";
  return fmtPct(part/total);
}
function roasValue(revenue, spend){
  if(!isNum(revenue) || !isNum(spend) || spend<=0) return null;
  return revenue/spend;
}
function roasLabel(revenue, spend){
  const r = roasValue(revenue, spend);
  return isNum(r) ? r.toFixed(2).replace(".",",")+"x" : "Não informado";
}
const STATUS_LABEL = {active:"Ativa", inactive:"Desativada", in_review:"Em análise"};
const CLASS_LABEL = {
  healthy:"Saudável", scale_opportunity:"Oportunidade de escala",
  attention:"Atenção", critical:"Crítica", insufficient:"Dados insuficientes"
};
const PRIO_LABEL = {urgente:"Urgente", alta:"Alta", media:"Média", baixa:"Baixa"};

function el(tag, attrs={}, html){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if(html!==undefined) e.innerHTML = html;
  return e;
}
</script>

<script>
/* =========================================================
   3. CÁLCULOS DERIVADOS
   Tudo abaixo é calculado a partir de dashboardData — nenhum
   total, percentual, CPA ou ROAS é digitado manualmente.
   ========================================================= */
function computeFunnelStats(funnel){
  const camps = funnel.campaigns;
  const spendVals = camps.map(c=>c.spend7d).filter(isNum);
  const convVals  = camps.map(c=>c.conversions7d).filter(isNum);
  const spend = spendVals.length ? spendVals.reduce((a,b)=>a+b,0) : null;
  const conv  = convVals.length ? convVals.reduce((a,b)=>a+b,0) : null;
  const revenueVals = camps
    .filter(c => c.daily && c.daily.length)
    .map(c => c.daily.reduce((a,d)=>a+(isNum(d.metaConvValue)?d.metaConvValue:0),0));
  const revenue = revenueVals.length ? revenueVals.reduce((a,b)=>a+b,0) : null;
  return {
    spend, conv, revenue,
    cpa: cpaValue(spend, conv),
    cpaLabel: cpaLabel(spend, conv),
    roas: roasValue(revenue, spend),
    roasLabel: roasLabel(revenue, spend),
    campaignCount: camps.length,
    activeCount: camps.filter(c=>c.status==="active").length,
    hasAnyDelivery: camps.some(c=>isNum(c.spend7d) && c.spend7d>0)
  };
}

function metaTotals7d(){
  let spend=0, conv=0;
  dashboardData.funnels.forEach(f=>{
    f.campaigns.forEach(c=>{
      if(isNum(c.spend7d)) spend += c.spend7d;
      if(isNum(c.conversions7d)) conv += c.conversions7d;
    });
  });
  return {spend, conv};
}

function trend(daily, field, recentDays){
  const valid = daily.filter(d=>isNum(d[field]));
  if(valid.length < recentDays+1) return null;
  const recent = valid.slice(-recentDays);
  const prior = valid.slice(0, valid.length-recentDays);
  if(!prior.length) return null;
  const avg = arr => arr.reduce((a,b)=>a+b[field],0)/arr.length;
  const recentAvg = avg(recent), priorAvg = avg(prior);
  if(priorAvg===0) return null;
  return (recentAvg-priorAvg)/priorAvg;
}

function median(arr){
  if(!arr.length) return null;
  const s=[...arr].sort((a,b)=>a-b);
  const mid=Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function classifyCampaign(camp, funnelStats, funnel, cfg){
  const spend = camp.spend7d, conv = camp.conversions7d;
  const evidence = [];
  if(!isNum(spend) || !isNum(conv) || (spend===0 && conv===0 && (!camp.daily || camp.daily.length===0))){
    return {
      classification:"insufficient", confidence:"baixa",
      evidence:["Sem investimento ou conversões registrados no período analisado."],
      reason: camp.status==="inactive"
        ? "Campanha desativada e sem veiculação no período — não há base para diagnóstico."
        : camp.status==="in_review"
          ? "Campanha em análise pelo Meta, sem veiculação no período — não há base para diagnóstico."
          : camp.startsToday
            ? "Campanha ativa recém-lançada (começa hoje) — ainda sem investimento nem conversões para avaliar."
            : camp.noteTag
              ? `Campanha ${camp.noteTag} recentemente e ainda não voltou a rodar — sem investimento nem conversões para avaliar.`
              : "Sem dados de investimento/conversão suficientes no período."
    };
  }
  if(conv===0){
    if(isNum(cfg.minimumSpendForAlert) && spend>=cfg.minimumSpendForAlert){
      return {classification:"critical", confidence:"média",
        evidence:[`Investimento de ${fmtBRL(spend)} no período sem nenhuma conversão registrada.`],
        reason:"Investimento relevante (acima do limite configurado) sem nenhum resultado."};
    }
    return {classification:"attention", confidence:"baixa",
      evidence:[`Investimento de ${fmtBRL(spend)} no período sem nenhuma conversão registrada.`],
      reason:"Investimento sem conversões. Sem um limite de gasto configurado (minimumSpendForAlert), não é possível confirmar gravidade — tratar como atenção até nova checagem."};
  }
  if(conv < cfg.minimumConversionsMediumConfidence){
    return {classification:"insufficient", confidence:"baixa",
      evidence:[`Apenas ${conv} conversão(ões) no período — abaixo do mínimo de ${cfg.minimumConversionsMediumConfidence} para leitura confiável.`],
      reason:"Volume de conversões insuficiente para uma conclusão segura."};
  }
  const confidence = conv >= cfg.minimumConversionsHighConfidence ? "alta" : "média";
  const cpa = spend/conv;
  const funnelCPA = funnelStats.cpa;
  const spendShare = isNum(funnelStats.spend) && funnelStats.spend>0 ? spend/funnelStats.spend : null;
  const convShare = isNum(funnelStats.conv) && funnelStats.conv>0 ? conv/funnelStats.conv : null;

  let cpaFlag = false, cpaDelta = null;
  if(isNum(cfg.targetCPA)){
    cpaFlag = cpa > cfg.targetCPA;
    evidence.push(`CPA de ${fmtBRL(cpa)} vs meta cadastrada de ${fmtBRL(cfg.targetCPA)}.`);
  } else if(isNum(funnelCPA) && funnelCPA>0){
    cpaDelta = (cpa-funnelCPA)/funnelCPA;
    cpaFlag = cpaDelta > (cfg.cpaAboveFunnelMultiplier-1);
    evidence.push(`CPA da campanha: ${fmtBRL(cpa)}; CPA consolidado do funil ${funnel.name}: ${fmtBRL(funnelCPA)} (${cpaDelta>=0?"+":""}${fmtPct(cpaDelta)}).`);
  }

  let dispropFlag = false;
  if(isNum(spendShare) && isNum(convShare)){
    dispropFlag = spendShare > cfg.highSpendShareThreshold && convShare < cfg.lowConversionShareThreshold;
    evidence.push(`Participação no investimento do funil: ${fmtPct(spendShare)}; participação nas conversões do funil: ${fmtPct(convShare)}.`);
  }

  const convTrend = trend(camp.daily, "conversions", auditConfig.trendRecentDays);
  const spendTrend = trend(camp.daily, "spend", auditConfig.trendRecentDays);
  let decliningFlag = false;
  if(convTrend!==null){
    decliningFlag = convTrend < -0.25;
    evidence.push(`Variação de conversões (últimos ${auditConfig.trendRecentDays} dias vs dias anteriores): ${convTrend>=0?"+":""}${fmtPct(convTrend)}.`);
  }
  let spendUpNoResult = false;
  if(convTrend!==null && spendTrend!==null){
    spendUpNoResult = spendTrend > 0.2 && convTrend <= 0;
  }

  if(cpaFlag || dispropFlag || decliningFlag || spendUpNoResult){
    return {classification:"attention", confidence, evidence,
      reason: cpaFlag ? "CPA acima do parâmetro de referência disponível."
        : dispropFlag ? "Concentra investimento do funil de forma desproporcional aos resultados que gera."
        : spendUpNoResult ? "Investimento cresceu sem crescimento proporcional de conversões."
        : "Queda relevante de conversões nos dias mais recentes."};
  }

  if(confidence==="alta" && (cpaDelta===null || cpaDelta<=0) && (convShare===null || convShare>=spendShare)){
    return {classification:"scale_opportunity", confidence, evidence,
      reason:"Volume de conversões alto, CPA em linha ou melhor que o funil, e participação nas conversões igual ou maior que a participação no investimento."};
  }

  return {classification:"healthy", confidence, evidence,
    reason:"Volume de dados suficiente e desempenho em linha com o restante do funil, sem sinais de alerta configurados."};
}
</script>

function periodCard(title, data, kind){
  const total = (isNum(data.metaSpend) && isNum(data.googleSpend)) ? data.metaSpend + data.googleSpend : null;
  const roas = roasValue(data.hotmartRevenue, total);
  const hasPromo = isNum(data.promoRevenue) && data.promoRevenue>0;
  const revenueExPromo = hasPromo && isNum(data.hotmartRevenue) ? data.hotmartRevenue - data.promoRevenue : null;
  const roasExPromo = hasPromo ? roasValue(revenueExPromo, total) : null;
  const showExPromoAsMain = hasPromo && roasExPromo!==null;
  const mainRevenue = showExPromoAsMain ? revenueExPromo : data.hotmartRevenue;
  const mainRoas = showExPromoAsMain ? roasExPromo : roas;

  const card = el("div", {class:`card period-card ${kind==='yesterday'?'yesterday':'last4'}`});
  card.appendChild(el("div",{class:"period-head"}, `<h3>${title}</h3>`));

  const stats = el("div",{class:"stat-tiles"});
  [
    ["Investimento", fmtBRL(total)],
    ["Receita", fmtBRL(mainRevenue)],
    ["ROAS", isNum(mainRoas) ? mainRoas.toFixed(2).replace(".",",")+"x" : "Não informado"]
  ].forEach(([label,val])=>{
    const tile = el("div",{class:"stat-tile"});
    tile.appendChild(el("div",{class:"stat-tile-label"}, label));
    tile.appendChild(el("div",{class:`stat-tile-value${val==="Não informado"?" na":""}`}, val));
    stats.appendChild(tile);
  });
  card.appendChild(stats);
  return card;
}

// produto "Assinatura..." ou "STLFLIX 4 ANOS..." = recorrência/renovação;
// "[BF..." = promoção — mesmo critério usado para excluir do ROAS real,
// aplicado aqui para isolar receita nova.
function isRecurringOrPromoProduct(name){
  return name.startsWith("Assinatura") || name.startsWith("[BF") || name.startsWith("STLFLIX 4 ANOS");
}

function renderProductGrowth(container){
  const snaps = dashboardData.productSnapshots;
  if(!snaps || snaps.length < 2) return;
  const prev = snaps[snaps.length-2], curr = snaps[snaps.length-1];

  const sec = el("section");
  sec.appendChild(el("div",{class:"section-title"},
    `<h2>Crescimento por produto (sem renovação)</h2><span class="tag">Hotmart · ${fmtDateBR(prev.date)} → ${fmtDateBR(curr.date)}</span>`));
  sec.appendChild(el("div",{class:"note"},
    `Considera só os produtos que aparecem no top-10 "Visão por produto" da Hotmart em cada um dos 2 dias, excluindo Assinaturas (mensalidade/renovação) e BF/promoções — o mesmo critério usado no ROAS real. Como o top-10 não cobre 100% das vendas do dia, produtos fora dele não entram nesta conta.`));

  const prevMap = {}; prev.products.filter(p=>!isRecurringOrPromoProduct(p.name)).forEach(p=> prevMap[p.name]=p);
  const currMap = {}; curr.products.filter(p=>!isRecurringOrPromoProduct(p.name)).forEach(p=> currMap[p.name]=p);
  const names = Array.from(new Set([...Object.keys(prevMap), ...Object.keys(currMap)]));

  const rows = names.map(name=>{
    const a = prevMap[name], b = currMap[name];
    const deltaRevenue = (b?b.revenue:0) - (a?a.revenue:0);
    return { name, a, b, deltaRevenue };
  }).sort((x,y)=>y.deltaRevenue - x.deltaRevenue);

  const totalPrev = Object.values(prevMap).reduce((s,p)=>s+p.revenue,0);
  const totalCurr = Object.values(currMap).reduce((s,p)=>s+p.revenue,0);
  const totalDelta = totalCurr - totalPrev;

  const card = el("div",{class:"card"});
  const stats = el("div",{class:"stat-tiles"});
  [
    [`Receita nova · ${fmtDateBR(prev.date)}`, fmtBRL(totalPrev)],
    [`Receita nova · ${fmtDateBR(curr.date)}`, fmtBRL(totalCurr)],
    ["Variação", `${totalDelta>=0?"+":""}${fmtBRL(totalDelta)}`]
  ].forEach(([label,val],i)=>{
    const tile = el("div",{class:"stat-tile"});
    tile.appendChild(el("div",{class:"stat-tile-label"}, label));
    const valueEl = el("div",{class:"stat-tile-value"}, val);
    if(i===2) valueEl.style.color = totalDelta>=0 ? "var(--green)" : "var(--red)";
    tile.appendChild(valueEl);
    stats.appendChild(tile);
  });
  card.appendChild(stats);
  card.appendChild(el("div",{class:"metric-sub", style:"margin-top:6px;"},
    totalPrev>0 ? `${totalDelta>=0?"Alta":"Queda"} de ${fmtPct(Math.abs(totalDelta)/totalPrev)} de um dia para o outro.` : ""));

  const tableWrap = el("div",{class:"table-scroll", style:"margin-top:16px;"});
  const table = el("table");
  table.appendChild(el("thead",{},
    `<tr><th>Produto</th><th>${fmtDateBR(prev.date)}</th><th>${fmtDateBR(curr.date)}</th><th>Variação</th></tr>`));
  const tbody = el("tbody");
  rows.forEach(r=>{
    const tr = el("tr");
    tr.appendChild(el("td",{}, r.name));
    tr.appendChild(el("td",{}, r.a ? `${fmtBRL(r.a.revenue)} (${r.a.sales})` : "—"));
    tr.appendChild(el("td",{}, r.b ? `${fmtBRL(r.b.revenue)} (${r.b.sales})` : "—"));
    const color = r.deltaRevenue>0 ? "var(--green)" : r.deltaRevenue<0 ? "var(--red)" : "inherit";
    tr.appendChild(el("td",{style:`color:${color};font-weight:600;`}, `${r.deltaRevenue>=0?"+":""}${fmtBRL(r.deltaRevenue)}`));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);
  sec.appendChild(card);
  container.appendChild(sec);
}

function renderSpendVsResult(container){
  const rows = [];
  dashboardData.funnels.forEach(funnel=>{
    funnel.campaigns.forEach(camp=>{
      if(!camp.daily || camp.daily.length < 2) return;
      const sorted = [...camp.daily].sort((a,b)=> a.date.localeCompare(b.date));
      const a = sorted[sorted.length-2], b = sorted[sorted.length-1];
      rows.push({
        funnel: funnel.name, campaign: camp.name,
        prevDate:a.date, currDate:b.date,
        spendDelta: b.spend - a.spend,
        spendPct: a.spend>0 ? (b.spend-a.spend)/a.spend : null,
        convDelta: b.conversions - a.conversions,
        valueDelta: (isNum(b.metaConvValue)&&isNum(a.metaConvValue)) ? b.metaConvValue - a.metaConvValue : null
      });
    });
  });
  if(!rows.length) return;
  rows.sort((x,y)=> y.spendDelta - x.spendDelta);
  const prevDate = rows[0].prevDate, currDate = rows[0].currDate;

  const sec = el("section");
  sec.appendChild(el("div",{class:"section-title"},
    `<h2>Investimento x resultado imediato por campanha</h2><span class="tag">Meta Ads · ${fmtDateBR(prevDate)} → ${fmtDateBR(currDate)}</span>`));
  sec.appendChild(el("div",{class:"note"},
    `Compara o investimento e o resultado (conversões e valor de conversão do Meta) dos 2 dias mais recentes de cada campanha, ordenado pela maior alta de investimento — para ver quem recebeu mais verba e o que aconteceu com o resultado no mesmo período. Não implica causalidade automática: o leilão do Meta leva alguns dias para reagir a um aumento de orçamento.`));

  const card = el("div",{class:"card"});
  const tableWrap = el("div",{class:"table-scroll"});
  const table = el("table");
  table.appendChild(el("thead",{},
    `<tr><th>Campanha</th><th>Funil</th><th>Investimento (${fmtDateBR(prevDate)}→${fmtDateBR(currDate)})</th><th>Conversões (Δ)</th><th>Valor conv. Meta (Δ)</th></tr>`));
  const tbody = el("tbody");
  rows.forEach(r=>{
    const tr = el("tr");
    tr.appendChild(el("td",{}, r.campaign));
    tr.appendChild(el("td",{}, r.funnel));
    const spendColor = r.spendDelta>0 ? "var(--green)" : r.spendDelta<0 ? "var(--red)" : "inherit";
    tr.appendChild(el("td",{style:`color:${spendColor};font-weight:600;`},
      `${r.spendDelta>=0?"+":""}${fmtBRL(r.spendDelta)}${isNum(r.spendPct)?` (${r.spendPct>=0?"+":""}${fmtPct(r.spendPct)})`:""}`));
    const convColor = r.convDelta>0 ? "var(--green)" : r.convDelta<0 ? "var(--red)" : "inherit";
    tr.appendChild(el("td",{style:`color:${convColor};`}, `${r.convDelta>=0?"+":""}${fmtNum(r.convDelta)}`));
    tr.appendChild(el("td",{}, isNum(r.valueDelta) ? `${r.valueDelta>=0?"+":""}${fmtBRL(r.valueDelta)}` : "Não informado"));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);
  sec.appendChild(card);
  container.appendChild(sec);
}
</script>

<script>
/* =========================================================
   5. RENDER — Performance por funil + gráficos
   ========================================================= */
let sortState = {}; // por funil: {key, dir}
const funnelChartInstances = {}; // por funil: {daily, campaigns}

function renderFunnels(container){
  const sec = el("section");
  sec.appendChild(el("div",{class:"section-title"},
    `<h2>Performance por funil</h2><span class="tag">Meta Ads · Últimos 7 dias (${fmtDateBR(dashboardData.funnelWindow.from)} a ${fmtDateBR(dashboardData.funnelWindow.to)})</span>`));

function renderFunnelCard(funnel, meta7, auditModel){
  const stats = computeFunnelStats(funnel);
  const card = el("div",{class:"funnel-card", style:`--fc:${funnel.color}`});
  const top = el("div",{class:"funnel-top"});

  const left = el("div");
  left.appendChild(el("div",{class:"funnel-name"}, `<span class="funnel-swatch"></span>${funnel.name}`));
  const badges = el("div",{class:"funnel-badges"});
  const statusCounts = {};

  Object.keys(statusCounts).forEach(s=>{
    badges.appendChild(el("span",{class:`badge ${s}`}, `${statusCounts[s]} ${STATUS_LABEL[s]}`));
  });
  left.appendChild(badges);
  top.appendChild(left);

  const metrics = el("div",{class:"funnel-metrics"});
  [
    ["Investimento 7d", fmtBRL(stats.spend)],
    ["Conversões (Meta)", fmtNum(stats.conv)],
    ["Custo por resultado", stats.cpaLabel],
    ["ROAS 7d (Meta)", stats.roasLabel],
    ["% do investimento total", shareLabel(stats.spend, meta7.spend)],
    ["% das conversões totais", shareLabel(stats.conv, meta7.conv)],
    ["Campanhas", `${stats.campaignCount} (${stats.activeCount} ativa${stats.activeCount!==1?"s":""})`]
  ].forEach(([l,v])=>{
    const fm = el("div",{class:"fm"});
    fm.appendChild(el("div",{class:"lbl"}, l));
    fm.appendChild(el("div",{class:"val" + (v==="Não informado"||v==="Sem conversões" ? " na" : "")}, v));
    metrics.appendChild(fm);
  });
  left.appendChild(metrics);

  const btn = el("button",{class:"toggle-btn"}, "Ver campanhas, gráficos e auditoria");
  top.appendChild(btn);
  card.appendChild(top);

  const body = el("div",{class:"funnel-body"});
  body.appendChild(renderCampaignTable(funnel, stats));

  if(funnel.demands && funnel.demands.length){
    const demandsCard = el("div",{class:"card", style:"margin-top:16px;"});
    demandsCard.appendChild(el("h3",{}, "Demandas do funil"));
    const ul = el("ul",{style:"margin:0;padding-left:18px;"});
    funnel.demands.forEach(d=> ul.appendChild(el("li",{style:"margin-bottom:6px;font-size:13px;"}, d)));
    demandsCard.appendChild(ul);
    body.appendChild(demandsCard);
  }

  const dailyCard = el("div",{class:"card", style:"margin-top:16px;"});
  dailyCard.appendChild(el("h3",{}, "Evolução diária (investimento, conversões, CPA e ROAS)"));
  const dailyBoxWrap = el("div",{class:"chart-box"});
  const dailyCanvas = el("canvas");
  dailyBoxWrap.appendChild(dailyCanvas);
  dailyCard.appendChild(dailyBoxWrap);
  body.appendChild(dailyCard);

  const auditWrap = el("div",{style:"margin-top:18px;"});
  auditWrap.appendChild(el("h3",{style:"font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;"}, "Auditoria das campanhas deste funil"));
  auditModel.filter(m=>m.funnel.id===funnel.id).forEach(item=> auditWrap.appendChild(renderCampaignAuditBlock(item)));
  body.appendChild(auditWrap);

  card.appendChild(body);

  let drawn = false;
  btn.addEventListener("click", ()=>{
    body.classList.toggle("open");
    btn.textContent = body.classList.contains("open") ? "Ocultar campanhas, gráficos e auditoria" : "Ver campanhas, gráficos e auditoria";
    if(body.classList.contains("open") && !drawn){
      drawn = true;
      drawFunnelDailyChart(funnel, dailyCard, dailyCanvas);
    }
  });

  return card;
}

function drawFunnelDailyChart(funnel, cardEl, canvas){
  const series = aggregateDailyForFunnels([funnel]);
  if(!chartsAvailable()){
    canvas.replaceWith(el("div",{class:"empty-state"}, "Não foi possível carregar a biblioteca de gráficos."));
    return;
  }
  if(!series.length){
    canvas.replaceWith(el("div",{class:"empty-state"}, "Não há detalhamento diário disponível para este funil."));
    return;
  }
  const cpaSeries = series.map(d => (isNum(d.spend) && isNum(d.conversions) && d.conversions>0) ? d.spend/d.conversions : null);
  const roasSeries = series.map(d => d.metaRoas);
  const hasRoas = roasSeries.some(isNum);

  const dailyTableWrap = el("div",{class:"table-scroll", style:"margin-top:12px;"});
  const dailyTable = el("table");
  dailyTable.appendChild(el("thead",{},`<tr><th>Data</th><th>Investimento</th><th>Conversões</th><th>CPA</th><th>ROAS (Meta)</th></tr>`));
  const dailyTbody = el("tbody");
  series.forEach((d,i)=>{
    const tr = el("tr");
    tr.appendChild(el("td",{}, fmtDateBR(d.date)));
    tr.appendChild(el("td",{}, fmtBRL(d.spend)));
    tr.appendChild(el("td",{}, fmtNum(d.conversions)));
    tr.appendChild(el("td",{}, cpaSeries[i]===null ? "Sem conversões" : fmtBRL(cpaSeries[i])));
    tr.appendChild(el("td",{}, isNum(roasSeries[i]) ? roasSeries[i].toFixed(2).replace(".",",")+"x" : "Não informado"));
    dailyTbody.appendChild(tr);
  });
  dailyTable.appendChild(dailyTbody);
  dailyTableWrap.appendChild(dailyTable);
  cardEl.appendChild(dailyTableWrap);
  if(hasRoas){
    cardEl.appendChild(el("div",{class:"note", style:"margin-top:8px;"},
      "ROAS (Meta) = valor de conversão atribuído pelo Meta ÷ investimento do dia — é a atribuição da própria plataforma, não a receita real confirmada na Hotmart (essa só existe nos cards de \"Visão global do negócio\", sem quebra por funil/dia)."));
  }

  const datalabelStyle = { color:"#e7ebf1", font:{size:10, weight:"600"}, align:"top", offset:4 };

  funnelChartInstances[funnel.id] = funnelChartInstances[funnel.id] || {};
  funnelChartInstances[funnel.id].daily = new Chart(canvas.getContext("2d"), {
    data:{
      labels: series.map(d=>fmtDateBR(d.date)),
      datasets:[
        { type:"bar", label:"Investimento (R$)", data: series.map(d=>d.spend), backgroundColor: funnel.color+"99", borderRadius:4, yAxisID:"y" },
        { type:"line", label:"Conversões", data: series.map(d=>d.conversions), borderColor:"#4ade80", backgroundColor:"#4ade80", tension:.3, yAxisID:"y1" },
        { type:"line", label:"CPA (R$)", data: cpaSeries, borderColor:"#f0a63a", backgroundColor:"#f0a63a", borderDash:[5,3], tension:.3, spanGaps:true, yAxisID:"y2",
          datalabels: {...datalabelStyle, color:"#f0a63a", align:"bottom", display: ctx => cpaSeries[ctx.dataIndex]!==null, formatter: v => v===null?"":fmtBRL(v).replace("R$ ","").replace("R$ ","")} },
        { type:"line", label:"ROAS (Meta)", data: roasSeries, borderColor:"#f472b6", backgroundColor:"#f472b6", tension:.3, spanGaps:true, yAxisID:"y3", hidden: !hasRoas,
          datalabels: {...datalabelStyle, color:"#f472b6", display: ctx => isNum(roasSeries[ctx.dataIndex]), formatter: v => isNum(v) ? v.toFixed(2).replace(".",",")+"x" : ""} }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{top:16} },
      plugins:{ legend:{labels:{color:"#e7ebf1", boxWidth:10}}, tooltip:{ callbacks:{ label: ctx => {
        if(ctx.dataset.label.indexOf("Investimento")>=0) return ` ${fmtBRL(ctx.parsed.y)}`;
        if(ctx.dataset.label.indexOf("CPA")>=0) return ctx.parsed.y===null ? " CPA: sem conversões" : ` CPA: ${fmtBRL(ctx.parsed.y)}`;
        if(ctx.dataset.label.indexOf("ROAS")>=0) return ctx.parsed.y===null ? " ROAS (Meta): não informado" : ` ROAS (Meta): ${ctx.parsed.y.toFixed(2).replace(".",",")}x`;
        return ` ${fmtNum(ctx.parsed.y)} conversões`;
      }}}},
      scales:{
        y:{ position:"left", ticks:{ color:"#9aa7b8", callback:v=>fmtBRL(v)}, grid:{color:"#232a35"} },
        y1:{ position:"right", ticks:{ color:"#9aa7b8" }, grid:{display:false} },
        y2:{ position:"right", display:false },
        y3:{ position:"right", display:false },
        x:{ ticks:{ color:"#e7ebf1", font:{size:10.5} }, grid:{display:false} }
      }
    }
  });
}

function renderCampaignTable(funnel, funnelStats){
  const wrap = el("div", {class:"table-scroll"});
  const key = funnel.id;
  if(!sortState[key]) sortState[key] = {field:"spend7d", dir:-1};

  const cols = [
    {k:"name", l:"Campanha"},
    {k:"status", l:"Status"},
    {k:"spend7d", l:"Investimento 7d"},
    {k:"conversions7d", l:"Conversões"},
    {k:"ctr", l:"CTR"},
    {k:"connectRate", l:"Connect rate"},
    {k:"cpa", l:"Custo/resultado"},
    {k:"roas", l:"ROAS 7d (Meta)"},
    {k:"spendShare", l:"% invest. funil"},
    {k:"convShare", l:"% conv. funil"}
  ];

  function buildRows(){
    return funnel.campaigns.map(c=>{
      const revenue7d = (c.daily && c.daily.length)
        ? c.daily.reduce((a,d)=>a+(isNum(d.metaConvValue)?d.metaConvValue:0),0)
        : null;
      return {
        c,
        spendShare: isNum(c.spend7d) && isNum(funnelStats.spend) && funnelStats.spend>0 ? c.spend7d/funnelStats.spend : null,
        convShare: isNum(c.conversions7d) && isNum(funnelStats.conv) && funnelStats.conv>0 ? c.conversions7d/funnelStats.conv : null,
        ctr: isNum(c.linkClicks7d) && isNum(c.impressions7d) && c.impressions7d>0 ? c.linkClicks7d/c.impressions7d : null,
        connectRate: isNum(c.landingPageViews7d) && isNum(c.linkClicks7d) && c.linkClicks7d>0 ? c.landingPageViews7d/c.linkClicks7d : null,
        cpa: cpaValue(c.spend7d, c.conversions7d),
        roas: roasValue(revenue7d, c.spend7d)
      };
    });
  }

  function draw(){
    wrap.innerHTML = "";
    const table = el("table");
    const thead = el("thead");
    const trh = el("tr");
    cols.forEach(col=>{
      const th = el("th", {}, col.l);
      if(sortState[key].field===col.k) th.classList.add("sorted");
      th.addEventListener("click", ()=>{
        if(sortState[key].field===col.k) sortState[key].dir *= -1;
        else { sortState[key].field = col.k; sortState[key].dir = -1; }
        draw();
      });
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    let rows = buildRows();
    const {field, dir} = sortState[key];
    rows.sort((a,b)=>{
      const get = r => field==="spendShare"||field==="convShare"||field==="cpa"||field==="roas"||field==="ctr"||field==="connectRate" ? r[field]
        : field==="name" ? r.c.name : field==="status" ? r.c.status : r.c[field];
      let va = get(a), vb = get(b);
      if(va===null||va===undefined) return 1;
      if(vb===null||vb===undefined) return -1;
      if(typeof va==="string") return -dir * va.localeCompare(vb);
      return dir>0 ? va-vb : vb-va;
    });

    const tbody = el("tbody");
    rows.forEach(r=>{
      const c = r.c;
      const tr = el("tr");
      if(c.status!=="active") tr.classList.add("inactive-row");
      tr.appendChild(el("td",{class:"camp-name"}, c.name));
      tr.appendChild(el("td",{}, `<span class="status-dot ${c.status}"></span>${STATUS_LABEL[c.status]}${c.startsToday?" · começa hoje":""}${c.noteTag?` · (${c.noteTag})`:""}`));
      tr.appendChild(el("td",{}, fmtBRL(c.spend7d)));
      tr.appendChild(el("td",{}, fmtNum(c.conversions7d)));
      tr.appendChild(el("td",{}, r.ctr===null? "Não informado" : fmtPct(r.ctr)));
      tr.appendChild(el("td",{}, r.connectRate===null? "Não informado" : fmtPct(r.connectRate)));
      tr.appendChild(el("td",{}, cpaLabel(c.spend7d, c.conversions7d)));
      tr.appendChild(el("td",{}, isNum(r.roas) ? r.roas.toFixed(2).replace(".",",")+"x" : "Não informado"));
      tr.appendChild(el("td",{}, r.spendShare===null? "Não informado" : fmtPct(r.spendShare)));
      tr.appendChild(el("td",{}, r.convShare===null? "Não informado" : fmtPct(r.convShare)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }
  draw();
  return wrap;
}

</script>

<script>
/* =========================================================
   6. RENDER — Visão gerencial (participação por funil)
   Mostrado ANTES do detalhamento por funil. Receita só existe
   consolidada (Hotmart não envia UTM/campanha), então participação
   em receita nunca é quebrada por funil — só investimento e
   conversões (Meta), que têm atribuição real por campanha.
   ========================================================= */
function chartsAvailable(){ return typeof Chart !== "undefined"; }

function renderFunnelShareOverview(container){
  const sec = el("section");
  sec.appendChild(el("div",{class:"section-title"}, `<h2>Visão gerencial — participação por funil</h2><span class="tag">Meta Ads · Últimos 7 dias</span>`));

  const last4 = dashboardData.businessSummary.last4Days;
  sec.appendChild(el("div",{class:"note"},
    `A receita líquida da Hotmart (${fmtBRL(last4.hotmartRevenue)} nos últimos 4 dias) só existe consolidada no negócio todo — não há UTM/produto ligando cada venda a um funil específico. Por isso, abaixo mostramos a participação real de cada funil no INVESTIMENTO e nas CONVERSÕES reportadas pelo Meta (não distribuímos receita da Hotmart entre funis sem atribuição confirmada).`));

  const stats = dashboardData.funnels.map(f=>({f, s:computeFunnelStats(f)}));
  const meta7 = metaTotals7d();

  const grid = el("div",{class:"grid grid-2", style:"margin-top:12px;"});

  const chartCard = el("div",{class:"card"});
  chartCard.appendChild(el("h3",{}, "Participação nas conversões (Meta) por funil"));

  const canvas = el("canvas");
  chartBoxWrap.appendChild(canvas);
  chartCard.appendChild(chartBoxWrap);
  grid.appendChild(chartCard);

  const tableCard = el("div",{class:"card"});
  tableCard.appendChild(el("h3",{}, "Participação linha a linha"));
  const tableWrap = el("div",{class:"table-scroll"});
  const table = el("table");
  table.appendChild(el("thead",{},`<tr>
    <th>Funil</th><th>Investimento 7d</th><th>% invest.</th>
    <th>Conversões</th><th>% conversões</th><th>CPA consolidado</th></tr>`));
  const tbody = el("tbody");
  stats.forEach(({f,s})=>{
    const tr = el("tr");
    tr.appendChild(el("td",{}, `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${f.color};margin-right:6px;"></span>${f.name}`));
    tr.appendChild(el("td",{}, fmtBRL(s.spend)));
    tr.appendChild(el("td",{}, shareLabel(s.spend, meta7.spend)));
    tr.appendChild(el("td",{}, fmtNum(s.conv)));
    tr.appendChild(el("td",{}, shareLabel(s.conv, meta7.conv)));
    tr.appendChild(el("td",{}, s.cpaLabel));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  tableCard.appendChild(tableWrap);
  tableCard.appendChild(el("div",{class:"note"}, `Receita líquida Hotmart do negócio (últimos 4 dias): ${fmtBRL(last4.hotmartRevenue)} — valor global, sem quebra por funil.`));
  grid.appendChild(tableCard);

  sec.appendChild(grid);
  container.appendChild(sec);

  const anyConv = stats.some(x=>isNum(x.s.conv) && x.s.conv>0);
  if(!chartsAvailable()){
    chartBoxWrap.replaceWith(el("div",{class:"empty-state"},"Não foi possível carregar a biblioteca de gráficos. Os números continuam disponíveis na tabela ao lado."));
    return;
  }
  if(!anyConv){
    chartBoxWrap.replaceWith(el("div",{class:"empty-state"},"Sem conversões suficientes para exibir este gráfico."));
    return;
  }
  new Chart(canvas.getContext("2d"), {
    type:"doughnut",
    data:{
      labels: stats.map(x=>x.f.name),
      datasets:[{ data: stats.map(x=>x.s.conv||0), backgroundColor: stats.map(x=>x.f.color), borderColor:"#161b22", borderWidth:2 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:"58%",
      plugins:{
        legend:{ position:"bottom", labels:{ color:"#e7ebf1", boxWidth:10, padding:14 } },
        tooltip:{ callbacks:{ label: ctx => {
          const v = ctx.parsed; const total = meta7.conv;
          return ` ${ctx.label}: ${fmtNum(v)} conversões (${fmtPct(v/total)})`;
        }}}
      }
    }
  });
}
</script>

<script>
/* =========================================================
   7. Agregação diária (usada pelos gráficos dentro de cada funil)
   ========================================================= */
function aggregateDailyForFunnels(funnels){
  const dateMap = {};
  funnels.forEach(f=>f.campaigns.forEach(c=>{
    (c.daily||[]).forEach(d=>{
      if(!dateMap[d.date]) dateMap[d.date] = {spend:0, conversions:0, metaConvValue:0, hasMetaConvValue:false};
      if(isNum(d.spend)) dateMap[d.date].spend += d.spend;
      if(isNum(d.conversions)) dateMap[d.date].conversions += d.conversions;
      if(isNum(d.metaConvValue)){ dateMap[d.date].metaConvValue += d.metaConvValue; dateMap[d.date].hasMetaConvValue = true; }
    });
  }));
  return Object.keys(dateMap).sort().map(date=>{
    const d = dateMap[date];
    const metaRoas = (d.hasMetaConvValue && isNum(d.spend) && d.spend>0) ? d.metaConvValue/d.spend : null;
    return {date, spend:d.spend, conversions:d.conversions, metaRoas};
  });
}
</script>

<script>
/* =========================================================
   8. AUDITORIA ESTRATÉGICA
   ========================================================= */
function buildAuditModel(){
  const model = [];
  dashboardData.funnels.forEach(funnel=>{
    const fStats = computeFunnelStats(funnel);
    const cpas = funnel.campaigns.map(c=>cpaValue(c.spend7d,c.conversions7d)).filter(isNum);
    const medianCPA = median(cpas);
    funnel.campaigns.forEach(camp=>{
      const result = classifyCampaign(camp, fStats, funnel, auditConfig);
      model.push({funnel, camp, fStats, medianCPA, ...result});
    });
  });
  return model;
}

function recommendationFor(item){
  switch(item.classification){
    case "critical": return "Revisar oferta, pixel/API de conversões e UTMs antes de qualquer novo aporte de verba.";
    case "attention": return item.reason.indexOf("desproporcional")>=0
        ? "Revisar a distribuição de verba dentro do funil; investigar criativos, público e página antes de escalar."
        : item.reason.indexOf("cresceu")>=0
          ? "Avaliar redução gradual do investimento até o resultado voltar a acompanhar o gasto."
          : item.reason.indexOf("Queda")>=0
            ? "Monitorar por mais alguns dias e revisar criativos/público antes de novas decisões."
            : item.reason.indexOf("acima do parâmetro")>=0
              ? "Avaliar redução gradual de investimento nesta campanha em favor das campanhas do funil com CPA melhor, e revisar público, posicionamentos e criativos."
              : item.reason.indexOf("Investimento sem conversões")>=0 || item.reason.indexOf("investimento sem")>=0
                ? "Verificar pixel, API de conversões e UTMs, e revisar oferta e página de destino antes de manter o investimento."
                : "Comparar Meta Ads e Hotmart e revisar criativos e página de destino.";
    case "scale_opportunity": return "Avaliar aumento gradual do investimento, mantendo o monitoramento diário do CPA.";
    case "insufficient": return camp_status_reco(item);
    default: return "Manter a campanha e monitorar por mais tempo.";
  }
}
function camp_status_reco(item){
  if(item.camp.status==="inactive") return "Campanha desativada sem veiculação — nenhuma ação necessária além de confirmar que o desligamento foi intencional.";
  if(item.camp.status==="in_review") return "Aguardar aprovação/veiculação do Meta antes de avaliar performance.";
  if(item.camp.startsToday) return "Campanha recém-lançada — aguardar os primeiros dias de veiculação antes de qualquer diagnóstico.";
  return "Monitorar por mais tempo até acumular volume suficiente de conversões.";
}

function campMetrics(c){
  if(!isNum(c.spend7d) || !isNum(c.impressions7d) || c.impressions7d===0) return null;
  return {
    cpm: c.spend7d/c.impressions7d*1000,
    cpcLink: isNum(c.linkClicks7d) && c.linkClicks7d>0 ? c.spend7d/c.linkClicks7d : null,
    ctr: isNum(c.linkClicks7d) ? c.linkClicks7d/c.impressions7d : null,
    freq: isNum(c.reach7d) && c.reach7d>0 ? c.impressions7d/c.reach7d : null,
    lpRate: isNum(c.landingPageViews7d) && isNum(c.linkClicks7d) && c.linkClicks7d>0 ? c.landingPageViews7d/c.linkClicks7d : null,
    convRate: isNum(c.conversions7d) && isNum(c.landingPageViews7d) && c.landingPageViews7d>0 ? c.conversions7d/c.landingPageViews7d : null
  };
}

// Hipóteses de gargalo por camada (entrega / criativo / página / rastreamento).
// Comparações são sempre relativas ao próprio funil (mediana das campanhas
// irmãs) — nunca contra benchmark de mercado. São hipóteses, não certezas.
function bottleneckHypothesis(camp, funnel){
  const m = campMetrics(camp);
  if(!m) return null;

  const siblingMetrics = funnel.campaigns
    .filter(c=>c!==camp)
    .map(campMetrics)
    .filter(Boolean);
  const medianOf = (key) => median(siblingMetrics.map(s=>s[key]).filter(isNum));
  const medCpm = medianOf("cpm"), medCpc = medianOf("cpcLink"), medCtr = medianOf("ctr"), medFreq = medianOf("freq");

  const convTrend = trend(camp.daily, "conversions", auditConfig.trendRecentDays);
  const ctrDaily = (camp.daily||[]).filter(d=>isNum(d.linkClicks)&&isNum(d.impressions)&&d.impressions>0).map(d=>({date:d.date, ctr:d.linkClicks/d.impressions}));
  const ctrTrend = ctrDaily.length>=4 ? trend(ctrDaily.map(d=>({conversions:d.ctr})), "conversions", auditConfig.trendRecentDays) : null;
  const freqTrend = trend((camp.daily||[]).map(d=>({conversions: isNum(d.reach)&&d.reach>0 ? d.impressions/d.reach : null})).filter(d=>isNum(d.conversions)), "conversions", auditConfig.trendRecentDays);

  const notes = { entrega:[], criativo:[], pagina:[], rastreamento:[] };

  // ENTREGA
  if(m.freq!==null && m.freq>2.2) notes.entrega.push(`Frequência de ${m.freq.toFixed(2)} no período sugere possível saturação de audiência.`);
  if(isNum(medFreq) && m.freq!==null && m.freq > medFreq*1.3) notes.entrega.push(`Frequência (${m.freq.toFixed(2)}) bem acima da mediana das outras campanhas do funil (${medFreq.toFixed(2)}) — o principal indício está em entrega/saturação, não em criativo.`);
  if(isNum(medCpm) && m.cpm > medCpm*1.3) notes.entrega.push(`CPM de ${fmtBRL(m.cpm)} está acima da mediana do funil (${fmtBRL(medCpm)}) — vale investigar concorrência de leilão, público ou posicionamentos.`);
  if(freqTrend!==null && freqTrend>0.2 && convTrend!==null && convTrend<=0) notes.entrega.push("A frequência vem subindo nos dias mais recentes enquanto as conversões não acompanham — indício de audiência se esgotando.");

  // CRIATIVO / COMUNICAÇÃO
  if(m.ctr!==null && m.ctr<0.01) notes.criativo.push(`CTR de link de ${fmtPct(m.ctr)}, abaixo de 1% — vale investigar criativos e copy.`);
  if(isNum(medCtr) && m.ctr!==null && m.ctr < medCtr*0.7) notes.criativo.push(`CTR (${fmtPct(m.ctr)}) abaixo da mediana das outras campanhas do funil (${fmtPct(medCtr)}) — o anúncio pode estar menos competitivo que os demais.`);
  if(isNum(medCpc) && m.cpcLink!==null && m.cpcLink > medCpc*1.3) notes.criativo.push(`Custo por clique no link (${fmtBRL(m.cpcLink)}) acima da mediana do funil (${fmtBRL(medCpc)}).`);
  if(ctrTrend!==null && ctrTrend < -0.25) notes.criativo.push("O CTR vem caindo nos dias mais recentes — vale investigar fadiga de criativo.");
  if(ctrTrend!==null && ctrTrend<-0.15 && freqTrend!==null && freqTrend>0.15) notes.criativo.push("Frequência subindo e CTR caindo ao mesmo tempo — indício combinado de fadiga de criativo.");

  // PÁGINA / OFERTA
  if(m.lpRate!==null && m.lpRate<0.5 && isNum(camp.linkClicks7d) && camp.linkClicks7d>50) notes.pagina.push(`Apenas ${fmtPct(m.lpRate)} dos cliques no link geraram visualização de página — vale investigar velocidade e experiência da página.`);
  if(m.convRate!==null && m.convRate>0 && m.convRate<0.02 && camp.landingPageViews7d>30) notes.pagina.push(`Bom volume de visualização de página, mas taxa de conversão de ${fmtPct(m.convRate)} — vale investigar oferta e comunicação da página.`);

  // RASTREAMENTO
  if(m.lpRate!==null && m.lpRate<0.25 && isNum(camp.linkClicks7d) && camp.linkClicks7d>80) notes.rastreamento.push(`Apenas ${fmtPct(m.lpRate)} dos cliques no link registraram visualização de página — volume baixo demais para ser só experiência de página; vale checar pixel/redirecionamento.`);
  if(isNum(camp.landingPageViews7d) && camp.landingPageViews7d>50 && camp.conversions7d===0) notes.rastreamento.push("Página foi visualizada dezenas de vezes sem nenhuma conversão registrada — vale checar se o evento de compra está disparando corretamente.");

  const flat = [...notes.entrega, ...notes.criativo, ...notes.pagina, ...notes.rastreamento];
  if(!flat.length) flat.push("Os dados ainda não são suficientes para confirmar em qual camada (entrega, criativo, página ou rastreamento) está o principal gargalo.");
  return {...m, notes, flat};
}

function renderCampaignAuditBlock(item){
  const {camp, funnel, fStats, medianCPA} = item;
  const details = el("details",{class:"campaign-audit"});
  const summary = el("summary");
  const titleBox = el("div",{class:"ca-title"});
  titleBox.appendChild(el("div",{class:"ca-name"}, camp.name));
  titleBox.appendChild(el("div",{class:"ca-meta"}, `${STATUS_LABEL[camp.status]}${camp.startsToday?" · começa hoje":""}${camp.noteTag?` · (${camp.noteTag})`:""}`));
  summary.appendChild(titleBox);
  const right = el("div",{class:"ca-right"});
  right.appendChild(el("span",{class:`class-badge ${item.classification}`}, CLASS_LABEL[item.classification]));
  right.appendChild(el("span",{class:"confidence"}, `Confiança: ${item.confidence}`));
  summary.appendChild(right);
  details.appendChild(summary);

  const body = el("div",{class:"ca-body"});
  const spendShare = isNum(camp.spend7d)&&isNum(fStats.spend)&&fStats.spend>0 ? camp.spend7d/fStats.spend : null;
  const convShare = isNum(camp.conversions7d)&&isNum(fStats.conv)&&fStats.conv>0 ? camp.conversions7d/fStats.conv : null;
  const metricsGrid = el("div",{class:"ca-metrics"});
  [
    ["Investimento 7d", fmtBRL(camp.spend7d)],
    ["Conversões (Meta)", fmtNum(camp.conversions7d)],
    ["Custo por resultado", cpaLabel(camp.spend7d, camp.conversions7d)],
    ["% invest. / % conv. do funil", spendShare===null?"Não informado":`${fmtPct(spendShare,0)} / ${convShare===null?"—":fmtPct(convShare,0)}`],
    ["CPA mediano do funil", isNum(medianCPA)?fmtBRL(medianCPA):"Não informado"]
  ].forEach(([l,v])=>{
    const m = el("div",{class:"ca-metric"});
    m.appendChild(el("div",{class:"l"}, l));
    m.appendChild(el("div",{class:"v"}, v));
    metricsGrid.appendChild(m);
  });
  body.appendChild(metricsGrid);

  // diagnóstico + recomendação — compacto, evidência já embutida na frase
  const insight = el("div",{class:"insight-block"});
  insight.appendChild(el("div",{class:"ik"},"Diagnóstico"));
  insight.appendChild(el("p",{}, `${item.reason} ${item.evidence.length ? item.evidence[0] : ""}`));
  insight.appendChild(el("div",{class:"ik"},"Recomendação"));
  insight.appendChild(el("p",{}, recommendationFor(item)));
  body.appendChild(insight);

  // gargalo (entrega/criativo/página/rastreamento) — mais hipóteses, formato enxuto
  const bottleneck = bottleneckHypothesis(camp, funnel);
  if(bottleneck && bottleneck.flat.length){
    const bBlock = el("div",{class:"insight-block", style:"border-left-color:#f0a63a;"});
    bBlock.appendChild(el("div",{class:"ik"},"Hipóteses de gargalo"));
    const ul = el("ul",{style:"margin:4px 0 0;padding-left:18px;"});
    bottleneck.flat.forEach(n=> ul.appendChild(el("li",{style:"margin-bottom:4px;"}, n)));
    bBlock.appendChild(ul);
    body.appendChild(bBlock);
  }

  details.appendChild(body);
  return details;
}

function renderGeneralDemands(container){
  if(!dashboardData.generalDemands || !dashboardData.generalDemands.length) return;
  const sec = el("section");
  sec.appendChild(el("div",{class:"section-title"}, `<h2>Demandas gerais</h2>`));
  const card = el("div",{class:"card"});
  dashboardData.generalDemands.forEach((group, i)=>{
    card.appendChild(el("h3",{style:`font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin:${i===0?"0":"18px"} 0 8px;`}, group.title));
    const ul = el("ul",{style:"margin:0;padding-left:18px;"});
    group.items.forEach(d=> ul.appendChild(el("li",{style:"margin-bottom:6px;font-size:13px;"}, d)));
    card.appendChild(ul);
  });
  sec.appendChild(card);
  container.appendChild(sec);
}
</script>
